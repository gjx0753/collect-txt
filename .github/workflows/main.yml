name: 'Daily Job'

on:
  schedule:
    - cron: '0 0 * * *'  # UTC
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'

permissions:
  contents: write

jobs:
  run_job:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: master           # 确保检出的是分支（避免 detached HEAD）
        fetch-depth: 0        # 让 git pull 有足够历史

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install opencc-python-reimplemented
        
    - name: Run Python script
      run: python main.py
      
    - name: Upload generated files
      uses: actions/upload-artifact@v4
      with:
        name: generated-files
        path: |
          bbxx.txt
          bbxx.m3u
          bbxx_lite.txt
          bbxx_lite.m3u
          others_output.txt
          tiyu.html
          
    - name: Ensure history directory exists
      run: mkdir -p history
      
    - name: Commit changes
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"
        
        git add bbxx.txt bbxx.m3u bbxx_lite.txt bbxx_lite.m3u others_output.txt tiyu.html
        if git diff --staged --quiet; then
          echo "No changes to commit for generated files"
        else
          git commit -m ":tada: AutoUpdate $(date +'%Y%m%d')"
        fi
        
        mkdir -p history
        current_datetime=$(date +"%Y%m%d_%H%M%S")
        zip_filename="history/${current_datetime}_archive_output.zip"
        zip -j "${zip_filename}" others_output.txt
        git add "${zip_filename}"
        git commit -m "Archive zipfile: ${current_datetime}"
          
    - name: Push changes
      uses: ad-m/github-push-action@v0.6.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: master
        pull: rebase         # 先 git pull --rebase，再 git push
